server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The app is a single page app with client-side routing, so any path that
    # is not a real file has to fall through to index.html. Without this,
    # /login-redirect (where Google sends candidates back after sign-in),
    # /instructions and /quiz are a 404 on refresh or when opened cold.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. They are repeated in every location that sets its own
    # add_header below, because nginx drops ALL inherited add_header directives
    # in any block that declares even one of its own. Left only at server level,
    # these would never reach index.html (served for every route) or /assets/.
    add_header X-Frame-Options        "DENY"        always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Frame-Options        "DENY"        always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "same-origin" always;
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy leaves people on the old
    # bundle pointing at asset names that no longer exist.
    location = /index.html {
        add_header Cache-Control          "no-cache, must-revalidate";
        add_header X-Frame-Options        "DENY"        always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "same-origin" always;
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
